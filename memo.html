# docker
    - linux가 제공하는 이런저런 기능을 짜집기 해서 유용하게 만들어둔거임
        * 그래서 원래는 윈도우에서 사용불가 => wsl 기반으로 동작
        * linux의 namespace : 프로그램끼리 영향을 주지않도록 분리시킴
        * c-group(control group) : 프로그램마다 CPU, RAM을 얼마나 점유할지 정해줌
    - linux의 runc를 이용하면 컨테이너를 만들어 볼 수 있음 => runc를 쉽게 사용하기위해 containerd가 나옴 => containerd를 쉽게 사용하기 위해 docker가 나옴
    - 물론 이미지 빌드, docker hub 등의 추가 기능을 제공하여 편의성을 더욱 키우기도 함

# docker 터미널 명령어
    - 이미지 실행 : docker run 이름:태그명
    - 백그라운드 실행(detached) : docker run -d -p 내컴퓨터포트:컨테이너포트 이름:태그명
        * 로컬 포트와 도커 포트를 연결
    - 실행중인 컨테이너 목록 : docker ps
    - 실행중인 컨테이너 로그 출력 : docker logs 컨테이너명
    - 실행중인 컨테이너 접속 : docker exec -it 컨테이너명 sh (터미널상에서 접속하는것)
    - 실행중인 컨테이너 정지 : docker stop 컨테이너명
    - 정지된 컨테이너 삭제 : docker rm 컨테이너명
    - 실행중인 컨테이너 강제 삭제 : docker rm -f 컨테이너명
    - 실행 시 환경변수 추가하기 : docker run -e 환경변수이름="값"
    - 올라와있는 이미지 다운로드 : docker pull 이미지명:태그

# Dockerfile의 성능 최적화
    * 프로젝트가 커지면 docker build 과정이 점점 길어짐
    - 빌드 시간 단축 팁 : 변하지 않는 항목은 위에, 변동사항 많은 부분은 밑에 작성하기

# Docker hub Repositories에 내 이미지 파일 올리고 사용하기
    - github에 올릴때처럼 레포지토리 하나를 생성하고 이미지파일의 이름을 레포지토리와 통일시킨후 push하여 업로드 할 수 있다.
        * 이미지 이름과 태그 변경하기 => docker tag 이미지명:태그명 변경할이미지명:변경할태그명
    - docker pull 명령어로 이미지를 내려받아 사용할 수 있다.

! nginx
# Reverse Proxy : 서버로 들어오는 요청을 가로채는 프로그램
    - 메인 웹서버로 들어오는 요청을 서버에 닿기전에 먼저 처리하여 여러가지 이점을 준다.
        * 메인 서버의 정보를 숨길 수 있음
        * https 인증서 설치가 쉬움
        * 로드 밸런싱 기능 구현에 유리
        * 로그 남기기 기능 구현에 유리
        * IP 차단 등을 통한 DDOS 방어가 가능
    - Nginx, Caddy 등이 대표적이다.

# Nginx를 Docker 이미지로 사용하기
    - 기본 사용법은 기존 docker와 같으며 Nginx 명령어를 conf 파일로 정의하면된다.

# Docker Network : 컨테이너간 통신
    - Nginx 같은 리버스 프록시를 사용하면 "80포트로 접속했을때 8080포트로 보내주세요" 같은 동작을 수행하게 된다.
    - 그런데 Docker 내부에서 Nginx 서버와 메인 웹서버 두 가상컴퓨터를 띄우면 서로 다른 컴퓨터환경이므로 포트도 따로 존재하는 상태가 된다.
    - 이때 Docker Network를 통해 가상 IP를 각 컴퓨터에 배정하고 가상IP주소:포트번호 형식으로 컨테이너끼리 통신을 할 수 있다.
    - 기본적으로는 bridge 모드로 네트워크가 실행된다. host 모드로도 실행이 가능하며 이경우 내 컴퓨터의 네트워크 자원을 직접 사용하는 권한이 생긴다. (일반적으론 사용빈도적음)

# Docker Network 터미널 명령어
    - docker network create 이름 : 네트워크 생성
    - docker network ls : 네트워크 목록 조회
    - docker run -d -p 도커포트:내컴포트 --network 네트워크명 --name 컨테이너명작명 이미지이름:태그
        * detached 모드로 포트를 내컴퓨터와 연결하고 미리 생성한 네트워크 내부에서 이미지를 실행한다. 컨테이너명을 작명해볼수도 있다.

# Volumes
    - 컨테이너는 지웠다가 다시 띄우면 내부 데이터가 모두 소실됨
    - Volumes라는 도커 저장소에 데이터를 저장하면 데이터를 영구저장 할 수 있음
    - 특정 컨테이너를 실행할때 volume을 붙여서 실행시킬 수 있다. (volume에 저장된 내용이 컨테이너로 복사되어 사용이 가능해진다.)

# docker compose (docker desktop에 포함된 기능)
    - 도커 명령어를 한 파일에 저장해두고 원할때 바로 실행할 수 있음
    - docker compose에 맞는 문법이 따로 있음 (yaml 형식에 맞추는것)
    - 실행하기(컨테이너 띄우기) : docker compose up -d (-d를 붙이면 백그라운드 실행)
    - 정지하기 : docker compose stop
    - 삭제하기(컨테이너 제거) : docker compose down
    - docker compose 안에 나란히 쓴 여러 서비스들은 자동으로 같은 네트워크안에 넣어준다
    - image 부분에 나한테 없는 이미지명을 쓰면 docker hub에서 자동으로 다운로드하여 실행한다.
    - depends_on을 통해 해당 컨테이너가 실행되기전 실행이 필요한 컨테이너를 정의한다. (실행 순서 조정)

    & network 추가 설정
        - 하나의 컨테이너는 여러개의 네트워크에 연결될 수 있다.
        - webserver와 nginx는 통신이 필요하고, webserver와 db도 통신이 필요하지만 db와 nginx는 통신할일이 없다.
        - 통신이 필요한 것끼리만 네트워크를 묶어두면 유지보수, 보안 측면에서 유리하다.
        - 이때 networks 최상위 속성을 통해 각 컨테이너를 원하는 네트워크에 연결시킬 수 있다.

    & volume 추가 설정
        - docker compose 에서 볼륨도 제어가 가능하다.
        - 볼륨명:컨테이너경로명 으로 기존과 같이 볼륨과 컨테이너 저장소를 연결시킬 수 있다.
        - 최상위 volumes 속성에 사용할 volume을 등록해야하며 external을 true로 설정해야 기존 볼륨을 사용한다. (없으면 새로운 볼륨을 만들어서 사용한다.)
        * bind mount : 내가 만든 폴더를 볼륨으로 사용하기
            - bind mount를 할때는 볼륨명쪽에 경로명을 작성하면 되며 따로 등록절차등이 필요없다.

    & 자동 재시작 설정
        - webserver의 경우 pm2를, nginx의 경우 systemctl을 통해 자동 재시작등을 매우 편리하게 제어할 수 있다.
        - 그러나 이런 설정없이 docker에서 재시작을 하도록 할수도 있다.
        - restart: always 옵션을 추가하면 컨테이너 종료시 자동 재시작을 해주며 docker 엔진이 껐다 켜져도 자동으로 시작해준다.
        - restart: unless-stopped 옵션을 추가하면 컨테이너 종료시에만 자동 재시작을 해주고 docker 엔진이 껐다 켜지면 자동 시작하지 않는다.
